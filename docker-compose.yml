services:
  whisperx:
    image: mekopa/whisperx-blackwell:latest
    container_name: whisperx
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      HF_HOME: "/root/.cache/huggingface"
      TORCH_HOME: "/root/.cache/torch"
    volumes:
      - whisperx-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8003 || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 10
    networks:
      - whisper

  whisper-bazarr-adapter:
    image: ghcr.io/alex10000121/bazarr_whisper_dgx/whisper-bazarr-adapter:latest
    container_name: whisper-bazarr-adapter
    restart: unless-stopped
    depends_on:
      whisperx:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      FWSERVER: "http://whisperx:8003"
      FWSERVER_TIMEOUT: "1200"
    networks:
      - whisper

volumes:
  whisperx-cache:

networks:
  whisper:
    external: true